<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="AI Builder Lab — current areas of building, exploring and learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="100%" stop-color="#0A0C14"/>
    </linearGradient>
    <pattern id="lgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <linearGradient id="lrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" rx="16" fill="url(#lbg)"/>
  <rect width="1000" height="360" rx="16" fill="url(#lgrid)"/>
  <rect x="0.75" y="0.75" width="998.5" height="358.5" rx="16" fill="none" stroke="#161A26" stroke-width="1.5"/>
  <rect x="0" y="0" width="1000" height="2" fill="url(#lrule)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

    <!-- card 1 -->
    <g>
      <rect x="28" y="36" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="28" y="36" width="300" height="2.2" rx="1" fill="#22D3EE">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <circle cx="52" cy="66" r="7" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
      <circle cx="52" cy="66" r="2.6" fill="#22D3EE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="71" fill="#F0F2F7" font-size="14.5" font-weight="600">Intelligent Systems</text>
      <text x="48" y="100" fill="#98A1B3" font-size="12">Building AI/ML applications and</text>
      <text x="48" y="120" fill="#98A1B3" font-size="12">experimenting with practical</text>
      <text x="48" y="140" fill="#98A1B3" font-size="12">machine learning workflows.</text>
      <rect x="48" y="150" width="70" height="17" rx="8.5" fill="#0E1626" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="83" y="162" fill="#22D3EE" font-size="9.5" letter-spacing="1.5" text-anchor="middle">BUILDING</text>
    </g>

    <!-- card 2 -->
    <g>
      <rect x="350" y="36" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="350" y="36" width="300" height="2.2" rx="1" fill="#7C5CFF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <circle cx="374" cy="66" r="7" fill="none" stroke="#7C5CFF" stroke-width="1.6"/>
      <circle cx="374" cy="66" r="2.6" fill="#7C5CFF">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="392" y="71" fill="#F0F2F7" font-size="14.5" font-weight="600">Generative AI</text>
      <text x="370" y="100" fill="#98A1B3" font-size="12">Exploring LLM-based applications,</text>
      <text x="370" y="120" fill="#98A1B3" font-size="12">prompt engineering and modern</text>
      <text x="370" y="140" fill="#98A1B3" font-size="12">GenAI workflows.</text>
      <rect x="370" y="150" width="76" height="17" rx="8.5" fill="#140E26" stroke="#7C5CFF" stroke-opacity="0.5"/>
      <text x="408" y="162" fill="#9D7BFF" font-size="9.5" letter-spacing="1.5" text-anchor="middle">EXPLORING</text>
    </g>

    <!-- card 3 -->
    <g>
      <rect x="672" y="36" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="672" y="36" width="300" height="2.2" rx="1" fill="#E879F9">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="696" cy="66" r="7" fill="none" stroke="#E879F9" stroke-width="1.6"/>
      <circle cx="696" cy="66" r="2.6" fill="#E879F9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="714" y="71" fill="#F0F2F7" font-size="14.5" font-weight="600">RAG Systems</text>
      <text x="692" y="100" fill="#98A1B3" font-size="12">Learning and building retrieval-</text>
      <text x="692" y="120" fill="#98A1B3" font-size="12">augmented generation</text>
      <text x="692" y="140" fill="#98A1B3" font-size="12">applications.</text>
      <rect x="692" y="150" width="70" height="17" rx="8.5" fill="#20132A" stroke="#E879F9" stroke-opacity="0.5"/>
      <text x="727" y="162" fill="#E879F9" font-size="9.5" letter-spacing="1.5" text-anchor="middle">LEARNING</text>
    </g>

    <!-- card 4 -->
    <g>
      <rect x="28" y="196" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="28" y="196" width="300" height="2.2" rx="1" fill="#7C5CFF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <circle cx="52" cy="226" r="7" fill="none" stroke="#7C5CFF" stroke-width="1.6"/>
      <circle cx="52" cy="226" r="2.6" fill="#7C5CFF">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="231" fill="#F0F2F7" font-size="14.5" font-weight="600">Agentic AI</text>
      <text x="48" y="260" fill="#98A1B3" font-size="12">Exploring autonomous workflows</text>
      <text x="48" y="280" fill="#98A1B3" font-size="12">using LangChain and</text>
      <text x="48" y="300" fill="#98A1B3" font-size="12">LangGraph.</text>
      <rect x="48" y="310" width="76" height="17" rx="8.5" fill="#140E26" stroke="#7C5CFF" stroke-opacity="0.5"/>
      <text x="86" y="322" fill="#9D7BFF" font-size="9.5" letter-spacing="1.5" text-anchor="middle">EXPLORING</text>
    </g>

    <!-- card 5 -->
    <g>
      <rect x="350" y="196" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="350" y="196" width="300" height="2.2" rx="1" fill="#22D3EE">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="374" cy="226" r="7" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
      <circle cx="374" cy="226" r="2.6" fill="#22D3EE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="392" y="231" fill="#F0F2F7" font-size="14.5" font-weight="600">Full Stack AI</text>
      <text x="370" y="260" fill="#98A1B3" font-size="12">Connecting AI systems with Python,</text>
      <text x="370" y="280" fill="#98A1B3" font-size="12">Flask, Django, React and</text>
      <text x="370" y="300" fill="#98A1B3" font-size="12">databases.</text>
      <rect x="370" y="310" width="70" height="17" rx="8.5" fill="#0E1626" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="405" y="322" fill="#22D3EE" font-size="9.5" letter-spacing="1.5" text-anchor="middle">BUILDING</text>
    </g>

    <!-- card 6 -->
    <g>
      <rect x="672" y="196" width="300" height="140" rx="12" fill="#0B0D15" stroke="#1E2434" stroke-width="1.4" stroke-dasharray="6 5"/>
      <rect x="672" y="196" width="300" height="2.2" rx="1" fill="#C9D0DE">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.5s" begin="3.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="696" cy="226" r="7" fill="none" stroke="#C9D0DE" stroke-width="1.6" stroke-dasharray="3 3">
        <animateTransform attributeName="transform" type="rotate" from="0 696 226" to="360 696 226" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="714" y="231" fill="#F0F2F7" font-size="14.5" font-weight="600">Next Step</text>
      <text x="692" y="260" fill="#98A1B3" font-size="12">Cloud Computing and DevOps —</text>
      <text x="692" y="280" fill="#98A1B3" font-size="12">the direction I am moving</text>
      <text x="692" y="300" fill="#98A1B3" font-size="12">toward next.</text>
      <rect x="692" y="310" width="58" height="17" rx="8.5" fill="#12151F" stroke="#C9D0DE" stroke-opacity="0.4"/>
      <text x="721" y="322" fill="#C9D0DE" font-size="9.5" letter-spacing="1.5" text-anchor="middle">NEXT</text>
    </g>
  </g>
</svg>
