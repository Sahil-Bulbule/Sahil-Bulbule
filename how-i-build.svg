<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Build loop: learn, build, break, debug, improve, repeat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="50%" stop-color="#0C0E17"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="900" height="150" rx="14" fill="url(#hbg)" stroke="#161A26" stroke-width="1.5"/>

  <path d="M55 75 H845" stroke="#1B2131" stroke-width="2" fill="none"/>
  <path d="M55 75 H845" stroke="url(#flow)" stroke-width="2" fill="none" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" values="0;-240" dur="5s" repeatCount="indefinite"/>
  </path>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="600">
    <g>
      <rect x="18" y="58" width="80" height="34" rx="17" fill="#0E1119" stroke="#22D3EE" stroke-opacity="0.6"/>
      <text x="58" y="80" fill="#E6E9F0">Learn</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="175" y="58" width="80" height="34" rx="17" fill="#0E1119" stroke="#4BB9EE" stroke-opacity="0.6"/>
      <text x="215" y="80" fill="#E6E9F0">Build</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="332" y="58" width="80" height="34" rx="17" fill="#0E1119" stroke="#7C5CFF" stroke-opacity="0.6"/>
      <text x="372" y="80" fill="#E6E9F0">Break</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="489" y="58" width="80" height="34" rx="17" fill="#0E1119" stroke="#8F5CFB" stroke-opacity="0.6"/>
      <text x="529" y="80" fill="#E6E9F0">Debug</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="646" y="58" width="88" height="34" rx="17" fill="#0E1119" stroke="#A25CF7" stroke-opacity="0.6"/>
      <text x="690" y="80" fill="#E6E9F0">Improve</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="805" y="58" width="80" height="34" rx="17" fill="#0E1119" stroke="#C084FC" stroke-opacity="0.6"/>
      <text x="845" y="80" fill="#E6E9F0">Repeat</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" begin="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <circle r="4" fill="#FFFFFF" opacity="0.9">
    <animateMotion path="M55 75 H845" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
