<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Animated neural network banner: Building with AI, LLMs, RAG, agents and full stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030F"/>
      <stop offset="1" stop-color="#150B30"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="600" cy="160" rx="440" ry="130" fill="url(#halo)"/>

  <!-- left network -->
  <g fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="5 7">
    <path d="M90 70L170 160L80 250"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M90 70L260 95L170 160L300 230L80 250"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M260 95L380 160L300 230"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <g filter="url(#glow)" fill="#D946EF">
    <circle cx="90" cy="70" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="160" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="250" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="95" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="230" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="160" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="3" fill="#F5D0FE" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M90,70 L170,160 L300,230 L380,160"/>
  </circle>

  <!-- right network -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="5 7">
    <path d="M1110 70L1030 160L1120 250"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M1110 70L940 95L1030 160L900 230L1120 250"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M940 95L820 160L900 230"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <g filter="url(#glow)" fill="#22D3EE">
    <circle cx="1110" cy="70" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="160" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="250" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="95" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="230" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="160" r="5"><animate attributeName="r" values="4;7;4" dur="3s" begin="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="3" fill="#A5F3FC" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M1110,70 L1030,160 L900,230 L820,160"/>
  </circle>

  <!-- centre text -->
  <text x="600" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="6" fill="#94A3B8">&gt; INITIALIZING PROFILE</text>
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="url(#tg)" filter="url(#glow)">BUILDING WITH AI</text>
  <text x="600" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" letter-spacing="5" fill="#CBD5E1">LLMs  •  RAG  •  AGENTS  •  FULL STACK</text>
  <rect x="440" y="234" width="320" height="2" rx="1" fill="url(#tg)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
