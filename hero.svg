<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Sahil Bulbule — AI/ML Engineer and Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="50%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="18" fill="url(#grid)"/>

  <circle cx="180" cy="60" r="180" fill="url(#glowA)">
    <animate attributeName="cy" values="60;100;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="200" r="190" fill="url(#glowB)">
    <animate attributeName="cy" values="200;150;200" dur="11s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="0" width="1000" height="2" fill="url(#sheen)"/>
  <rect x="0" y="248" width="1000" height="2" fill="url(#sheen)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="82" fill="#8B93A7" font-size="15" letter-spacing="7">AI / ML  ·  FULL STACK  ·  BUILDER</text>

    <text x="500" y="146" fill="#F4F6FA" font-size="52" font-weight="700" letter-spacing="1">
      Sahil Bulbule
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <rect x="330" y="166" width="340" height="1.5" fill="url(#rule)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="204" fill="#A7B0C2" font-size="17" letter-spacing="0.5">
      Building intelligent systems and modern web experiences.
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
    </text>
  </g>

  <g fill="#22D3EE">
    <circle cx="60" cy="210" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="45" r="2.5" fill="#C084FC">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="905" cy="90" r="1.8" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
