<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" role="img" aria-label="04 / Currently Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="297" y1="0" x2="990" y2="0"><stop offset="0" stop-color="#E11D48"/><stop offset="0.5" stop-color="#CBD5E1" stop-opacity="0.8"/><stop offset="1" stop-color="#2563EB" stop-opacity="0.15"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="16" width="6" height="6" fill="#E11D48"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></rect>
