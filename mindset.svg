<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-label="Developer mindset: Observe, Experiment, Debug, Ship, Evolve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#E11D48"/><stop offset="0.5" stop-color="#CBD5E1"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="898" height="188" rx="16" fill="#0B0D13"/>
<rect x="1" y="1" width="898" height="188" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></rect>
<text x="32" y="38" font-family="'Courier New', monospace" font-size="12" letter-spacing="4" fill="#94A3B8">// DEVELOPER MINDSET</text>
<text x="450" y="104" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="800" fill="#F1F5F9">Observe <tspan fill="#E11D48">→</tspan> Experiment <tspan fill="#E11D48">→</tspan> Debug <tspan fill="#3B82F6">→</tspan> Ship <tspan fill="#3B82F6">→</tspan> Evolve</text>
<text x="450" y="138" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-style="italic" fill="#94A3B8">Every bug is training data.</text>
<line x1="32" y1="164" x2="868" y2="164" stroke="url(#bd)" stroke-width="2" stroke-opacity="0.5"/>
<circle r="3.5" cy="164" fill="#E11D48" filter="url(#glow)"><animate attributeName="cx" values="32;868" dur="3.5s" repeatCount="indefinite"/></circle>
<circle r="3.5" cy="164" fill="#3B82F6" filter="url(#glow)"><animate attributeName="cx" values="868;32" dur="3.5s" repeatCount="indefinite"/></circle>
</svg>
