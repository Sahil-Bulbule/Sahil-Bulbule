<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Skills dashboard centred on an AI core" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="55%" stop-color="#0A0C14"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>
    <pattern id="sgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#7C5CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wire2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="topRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E879F9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="690" rx="18" fill="url(#sbg)"/>
  <rect width="1000" height="690" rx="18" fill="url(#sgrid)"/>
  <rect x="0.75" y="0.75" width="998.5" height="688.5" rx="18" fill="none" stroke="#161A26" stroke-width="1.5"/>
  <rect x="0" y="0" width="1000" height="2" fill="url(#topRule)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2.5" fill="#4A5266">
    <text x="30" y="30">STACK OVERVIEW</text>
    <text x="970" y="30" text-anchor="end">SAHIL BULBULE</text>
  </g>

  <!-- ===== connector wires ===== -->
  <g fill="none" stroke-width="1.6" stroke-dasharray="7 10">
    <path d="M280 135 H340 V320 H395" stroke="url(#wire)">
      <animate attributeName="stroke-dashoffset" values="0;-170" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M280 320 H395" stroke="url(#wire)">
      <animate attributeName="stroke-dashoffset" values="0;-170" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M280 505 H340 V320 H395" stroke="url(#wire)">
      <animate attributeName="stroke-dashoffset" values="0;-170" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <path d="M720 135 H660 V320 H605" stroke="url(#wire2)">
      <animate attributeName="stroke-dashoffset" values="0;170" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M720 320 H605" stroke="url(#wire2)">
      <animate attributeName="stroke-dashoffset" values="0;170" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M720 505 H660 V320 H605" stroke="url(#wire2)">
      <animate attributeName="stroke-dashoffset" values="0;170" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <path d="M500 425 V575" stroke="url(#wire)">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="4.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== centre core ===== -->
  <circle cx="500" cy="320" r="150" fill="url(#coreGlow)">
    <animate attributeName="r" values="140;158;140" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g fill="none">
    <circle cx="500" cy="320" r="104" stroke="#2A3145" stroke-width="1.2" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0 500 320" to="360 500 320" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="320" r="86" stroke="#7C5CFF" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="46 26">
      <animateTransform attributeName="transform" type="rotate" from="360 500 320" to="0 500 320" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="320" r="68" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="10 14">
      <animateTransform attributeName="transform" type="rotate" from="0 500 320" to="360 500 320" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="500" cy="320" r="56" fill="#0B0D15" stroke="#1F2536" stroke-width="1.5"/>

  <g>
    <circle r="4" fill="#22D3EE">
      <animateMotion dur="14s" repeatCount="indefinite" path="M500 216 a104 104 0 1 1 -0.1 0"/>
    </circle>
    <circle r="3.2" fill="#E879F9">
      <animateMotion dur="10s" repeatCount="indefinite" path="M500 234 a86 86 0 1 0 0.1 0"/>
    </circle>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="312" fill="#F4F6FA" font-size="21" font-weight="700" letter-spacing="2">AI CORE</text>
    <text x="500" y="336" fill="#8B93A7" font-size="11" letter-spacing="1.5">ML · DL · GENAI</text>
    <text x="500" y="356" fill="#5E677C" font-size="9.5" letter-spacing="2">
      ACTIVE
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===== left column panels ===== -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g>
      <rect x="40" y="60" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="40" y="60" width="240" height="2.2" rx="1" fill="#22D3EE" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="90" fill="#22D3EE" font-size="11" letter-spacing="2.5" font-weight="600">LANGUAGES</text>
      <text x="60" y="118" fill="#C9D0DE" font-size="13">Python</text>
      <text x="60" y="142" fill="#C9D0DE" font-size="13">JavaScript</text>
      <text x="60" y="166" fill="#C9D0DE" font-size="13">C++</text>
      <text x="60" y="190" fill="#C9D0DE" font-size="13">Java</text>
    </g>

    <g>
      <rect x="40" y="245" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="40" y="245" width="240" height="2.2" rx="1" fill="#22D3EE" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="275" fill="#22D3EE" font-size="11" letter-spacing="2.5" font-weight="600">FRONTEND</text>
      <text x="60" y="303" fill="#C9D0DE" font-size="13">HTML5</text>
      <text x="60" y="327" fill="#C9D0DE" font-size="13">CSS3</text>
      <text x="60" y="351" fill="#C9D0DE" font-size="13">JavaScript</text>
      <text x="60" y="375" fill="#C9D0DE" font-size="13">React.js</text>
    </g>

    <g>
      <rect x="40" y="430" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="40" y="430" width="240" height="2.2" rx="1" fill="#22D3EE" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="460" fill="#22D3EE" font-size="11" letter-spacing="2.5" font-weight="600">BACKEND</text>
      <text x="60" y="490" fill="#C9D0DE" font-size="13">Python</text>
      <text x="60" y="516" fill="#C9D0DE" font-size="13">Flask</text>
      <text x="60" y="542" fill="#C9D0DE" font-size="13">Django</text>
    </g>

    <!-- ===== right column panels ===== -->
    <g>
      <rect x="720" y="60" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="720" y="60" width="240" height="2.2" rx="1" fill="#7C5CFF" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="740" y="90" fill="#9D7BFF" font-size="11" letter-spacing="2.5" font-weight="600">AI / ML</text>
      <text x="740" y="116" fill="#C9D0DE" font-size="12.5">Machine Learning</text>
      <text x="740" y="138" fill="#C9D0DE" font-size="12.5">Deep Learning</text>
      <text x="740" y="160" fill="#C9D0DE" font-size="12.5">ANN · CNN · RNN</text>
      <text x="740" y="182" fill="#C9D0DE" font-size="12.5">LSTM · GRU</text>
      <text x="740" y="200" fill="#8B93A7" font-size="12">NLP</text>
    </g>

    <g>
      <rect x="720" y="245" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="720" y="245" width="240" height="2.2" rx="1" fill="#E879F9" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="1.9s" repeatCount="indefinite"/>
      </rect>
      <text x="740" y="275" fill="#E879F9" font-size="11" letter-spacing="2.5" font-weight="600">GENERATIVE AI</text>
      <text x="740" y="300" fill="#C9D0DE" font-size="12.5">LLMs · Generative AI</text>
      <text x="740" y="322" fill="#C9D0DE" font-size="12.5">RAG</text>
      <text x="740" y="344" fill="#C9D0DE" font-size="12.5">Agentic AI</text>
      <text x="740" y="366" fill="#C9D0DE" font-size="12.5">LangChain</text>
      <text x="740" y="386" fill="#C9D0DE" font-size="12.5">LangGraph</text>
    </g>

    <g>
      <rect x="720" y="430" width="240" height="150" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="720" y="430" width="240" height="2.2" rx="1" fill="#7C5CFF" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="740" y="460" fill="#9D7BFF" font-size="11" letter-spacing="2.5" font-weight="600">DATABASES</text>
      <text x="740" y="488" fill="#C9D0DE" font-size="13">MongoDB</text>
      <text x="740" y="512" fill="#C9D0DE" font-size="13">MySQL · SQL</text>
      <text x="740" y="536" fill="#C9D0DE" font-size="13">Firebase</text>
    </g>

    <!-- ===== bottom panel ===== -->
    <g>
      <rect x="330" y="575" width="340" height="82" rx="12" fill="#0A0C14" stroke="#1E2434" stroke-width="1.4"/>
      <rect x="330" y="575" width="340" height="2.2" rx="1" fill="#22D3EE" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="500" y="603" fill="#22D3EE" font-size="11" letter-spacing="2.5" font-weight="600" text-anchor="middle">TOOLS</text>
      <text x="500" y="628" fill="#C9D0DE" font-size="13" text-anchor="middle">Git · GitHub · Docker</text>
      <text x="500" y="648" fill="#C9D0DE" font-size="13" text-anchor="middle">VS Code · Postman · Figma</text>
    </g>
  </g>
</svg>
