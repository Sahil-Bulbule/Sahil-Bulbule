<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Sahil Bulbule - animated developer room with typing terminal and a sleeping cat">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a1d"/>
      <stop offset="1" stop-color="#241810"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="302" y="122" width="316" height="146" rx="3"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; }
    .t { font-size: 13px; }
    .cmd { fill: #39d353; }
    .out { fill: #e6edf3; }
    .cover { fill: #070b14; }

    .c1 { animation: k1 22s infinite; }
    .c2 { animation: k2 22s infinite; }
    .c3 { animation: k3 22s infinite; }
    .c4 { animation: k4 22s infinite; }
    .c5 { animation: k5 22s infinite; }
    .c6 { animation: k6 22s infinite; }
    @keyframes k1 { 0%,2.7%{transform:translateX(0);animation-timing-function:steps(9,end)} 8.2%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }
    @keyframes k2 { 0%,17.3%{transform:translateX(0);animation-timing-function:steps(15,end)} 22.8%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }
    @keyframes k3 { 0%,31.8%{transform:translateX(0);animation-timing-function:steps(6,end)} 37.3%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }
    @keyframes k4 { 0%,46.4%{transform:translateX(0);animation-timing-function:steps(30,end)} 51.9%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }
    @keyframes k5 { 0%,60.9%{transform:translateX(0);animation-timing-function:steps(7,end)} 66.4%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }
    @keyframes k6 { 0%,75.5%{transform:translateX(0);animation-timing-function:steps(15,end)} 81%,96%{transform:translateX(300px)} 96.1%,100%{transform:translateX(0)} }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .25; } 50% { opacity: .5; } }

    .star { animation: tw 3s ease-in-out infinite; }
    .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,1.07); } }
    .tailwag { transform-box: fill-box; transform-origin: 0% 50%; animation: tail 5s ease-in-out infinite; }
    @keyframes tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

    .z { font-weight: 700; fill: #9fb6ff; opacity: 0; animation: zz 4.5s ease-in infinite; }
    .z2 { animation-delay: 1.5s; } .z3 { animation-delay: 3s; }
    @keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px,-48px); } }

    .hand-m { transform-origin: 800px 70px; animation: spin 60s linear infinite; }
    .hand-h { transform-origin: 800px 70px; animation: spin 720s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .steam { opacity: 0; animation: steam 3s ease-out infinite; }
    .st2 { animation-delay: 1.2s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-16px); } }

    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .float { animation: fl 4s ease-in-out infinite; }
    @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>

  <!-- room -->
  <rect width="900" height="420" fill="url(#wall)"/>
  <rect y="318" width="900" height="102" fill="url(#floor)"/>
  <rect y="312" width="900" height="8" fill="#1d1510"/>

  <!-- window -->
  <rect x="40" y="70" width="170" height="150" rx="4" fill="#2a3556"/>
  <rect x="48" y="78" width="154" height="134" fill="#070d1f"/>
  <circle class="star" cx="70" cy="100" r="2" fill="#fff"/>
  <circle class="star s2" cx="110" cy="130" r="1.6" fill="#fff"/>
  <circle class="star s3" cx="150" cy="95" r="2" fill="#fff"/>
  <circle class="star s4" cx="90" cy="175" r="1.6" fill="#fff"/>
  <circle class="star s2" cx="175" cy="160" r="2" fill="#fff"/>
  <circle class="star s3" cx="130" cy="195" r="1.4" fill="#fff"/>
  <path d="M168 100 a16 16 0 1 0 12 26 a13 13 0 1 1 -12 -26z" fill="#f6efc8"/>
  <rect x="123" y="78" width="4" height="134" fill="#2a3556"/>
  <rect x="48" y="142" width="154" height="4" fill="#2a3556"/>
  <rect x="34" y="214" width="182" height="8" rx="2" fill="#2a3556"/>

  <!-- name plate -->
  <rect x="320" y="22" width="260" height="42" fill="#f4efd8" stroke="#1b2233" stroke-width="3"/>
  <text x="450" y="52" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#1b2233">SAHIL BULBULE</text>

  <!-- wall clock (decor) -->
  <circle cx="800" cy="70" r="30" fill="#e9e4d2" stroke="#2a3556" stroke-width="4"/>
  <circle cx="800" cy="70" r="2.5" fill="#1b2233"/>
  <line class="hand-h" x1="800" y1="70" x2="800" y2="54" stroke="#1b2233" stroke-width="3" stroke-linecap="round"/>
  <line class="hand-m" x1="800" y1="70" x2="800" y2="46" stroke="#39d353" stroke-width="2" stroke-linecap="round"/>

  <!-- shelves -->
  <rect x="690" y="165" width="170" height="7" rx="2" fill="#5a3b25"/>
  <rect x="702" y="130" width="14" height="35" fill="#e04f5f"/>
  <rect x="718" y="124" width="12" height="41" fill="#39d353"/>
  <rect x="732" y="134" width="16" height="31" fill="#f2b84b"/>
  <rect x="750" y="128" width="12" height="37" fill="#4a90e2"/>
  <rect x="690" y="235" width="170" height="7" rx="2" fill="#5a3b25"/>
  <rect x="812" y="212" width="22" height="23" rx="3" fill="#c96b3c"/>
  <g class="sway"><ellipse cx="823" cy="204" rx="6" ry="12" fill="#39d353"/><ellipse cx="814" cy="206" rx="5" ry="10" fill="#2fa84a" transform="rotate(-25 814 206)"/><ellipse cx="832" cy="206" rx="5" ry="10" fill="#2fa84a" transform="rotate(25 832 206)"/></g>

  <!-- desk -->
  <rect x="250" y="292" width="420" height="14" rx="2" fill="#6a4529"/>
  <rect x="268" y="306" width="12" height="12" fill="#4a2f1c"/>
  <rect x="640" y="306" width="12" height="12" fill="#4a2f1c"/>

  <!-- monitor -->
  <rect x="290" y="110" width="340" height="170" rx="8" fill="#1b2233"/>
  <rect x="302" y="122" width="316" height="146" rx="3" fill="#070b14"/>
  <rect class="glow" x="290" y="110" width="340" height="170" rx="8" fill="#39d353" filter="url(#blur)" opacity=".3"/>
  <rect x="448" y="280" width="24" height="12" fill="#1b2233"/>
  <rect x="395" y="283" width="130" height="8" rx="2" fill="#2a3556"/>

  <!-- terminal text -->
  <g clip-path="url(#screenClip)">
    <circle cx="316" cy="132" r="3" fill="#ff5f56"/><circle cx="327" cy="132" r="3" fill="#ffbd2e"/><circle cx="338" cy="132" r="3" fill="#27c93f"/>
    <text class="t cmd" x="316" y="156">$ whoami</text>
    <text class="t out" x="316" y="174">&gt; Sahil Bulbule</text>
    <text class="t cmd" x="316" y="192">$ role</text>
    <text class="t out" x="316" y="210">&gt; AI/ML Engineer | Python | Full Stack</text>
    <text class="t cmd" x="316" y="228">$ where</text>
    <text class="t out" x="316" y="246">&gt; Nagpur, India</text>
    <text class="t cmd" x="316" y="264">$</text>
    <rect class="blink" x="330" y="253" width="8" height="13" fill="#39d353"/>

    <rect class="cover c1" x="314" y="143" width="304" height="17"/>
    <rect class="cover c2" x="314" y="161" width="304" height="17"/>
    <rect class="cover c3" x="314" y="179" width="304" height="17"/>
    <rect class="cover c4" x="314" y="197" width="304" height="17"/>
    <rect class="cover c5" x="314" y="215" width="304" height="17"/>
    <rect class="cover c6" x="314" y="233" width="304" height="17"/>
  </g>

  <!-- mug with steam -->
  <rect x="610" y="270" width="22" height="22" rx="3" fill="#e9e4d2"/>
  <path d="M632 276 h6 a5 5 0 0 1 0 10 h-6" fill="none" stroke="#e9e4d2" stroke-width="3"/>
  <path class="steam" d="M617 266 q-4 -6 0 -10" fill="none" stroke="#cfd8e8" stroke-width="2" stroke-linecap="round"/>
  <path class="steam st2" d="M625 266 q-4 -6 0 -10" fill="none" stroke="#cfd8e8" stroke-width="2" stroke-linecap="round"/>

  <!-- floor plant -->
  <rect x="86" y="330" width="40" height="42" rx="4" fill="#c96b3c"/>
  <g class="sway">
    <ellipse cx="106" cy="296" rx="9" ry="28" fill="#2fa84a"/>
    <ellipse cx="88" cy="306" rx="8" ry="22" fill="#39d353" transform="rotate(-30 88 306)"/>
    <ellipse cx="124" cy="306" rx="8" ry="22" fill="#39d353" transform="rotate(30 124 306)"/>
  </g>

  <!-- cushion -->
  <ellipse cx="765" cy="372" rx="105" ry="24" fill="#6b2f52"/>
  <ellipse cx="765" cy="366" rx="95" ry="18" fill="#8a3d68"/>

  <!-- sleeping cat -->
  <g class="breathe">
    <path class="tailwag" d="M838 360 q36 -2 30 -34 q-4 -16 -22 -12" fill="none" stroke="#e8923a" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="780" cy="352" rx="62" ry="28" fill="#e8923a"/>
    <path d="M760 328 q4 14 0 26 M782 325 q4 15 0 29 M804 328 q4 14 0 26" fill="none" stroke="#c4701f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <polygon points="705,336 708,314 724,328" fill="#e8923a"/>
    <polygon points="745,336 742,314 726,328" fill="#e8923a"/>
    <polygon points="710,333 711,321 720,329" fill="#f6b4b4"/>
    <circle cx="725" cy="350" r="24" fill="#e8923a"/>
    <path d="M712 348 q6 6 12 0" fill="none" stroke="#3a2210" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M728 348 q6 6 12 0" fill="none" stroke="#3a2210" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M722 357 l6 0 l-3 4z" fill="#f08a9a"/>
    <path d="M700 358 l-14 -2 M700 362 l-14 3 M750 358 l14 -2 M750 362 l14 3" stroke="#f4d9b0" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <rect x="696" y="360" width="80" height="22" rx="10" fill="#e8923a" opacity="0"/>
  <text class="z" x="740" y="318" font-size="20">Z</text>
  <text class="z z2" x="740" y="318" font-size="16">z</text>
  <text class="z z3" x="740" y="318" font-size="12">z</text>
</svg>
