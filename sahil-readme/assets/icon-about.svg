<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: p 2s ease-out infinite; }
    @keyframes p { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
    .b { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  </style>
  <circle class="ring" cx="32" cy="32" r="24" fill="none" stroke="#39d353" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="#0d1117" stroke="#39d353" stroke-width="2"/>
  <g class="b"><circle cx="32" cy="26" r="8" fill="#39d353"/><path d="M16 50 q16 -22 32 0z" fill="#39d353"/></g>
</svg>
