<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" role="img" aria-label="Animated gradient divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="0.8" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="6" width="1000" height="2" rx="1" fill="url(#l)"/>
  <circle cx="0" cy="7" r="4" fill="#F5D0FE" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
