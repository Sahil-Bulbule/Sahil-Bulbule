<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240" role="img" aria-label="Learning journey from Python to Cloud Computing and DevOps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="100%" stop-color="#0B0D15"/>
    </linearGradient>
    <linearGradient id="jpath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="jrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1098" height="238" rx="16" fill="url(#jbg)" stroke="#161A26" stroke-width="1.5"/>
  <rect x="1" y="1" width="1098" height="1.6" fill="url(#jrule)"/>

  <path d="M60 120 H1040" stroke="#1B2131" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M60 120 H1040" stroke="url(#jpath)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="14 18" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-320" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle r="4.5" fill="#FFFFFF" opacity="0.9">
    <animateMotion path="M60 120 H1040" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;1;0.15" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="60" cy="120" r="8" fill="#0B0D15" stroke="#22D3EE" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="60" y="94" fill="#E6E9F0" font-size="12.5" font-weight="600">Python</text>
      <text x="60" y="152" fill="#5E677C" font-size="10.5">01</text>
    </g>
    <g>
      <circle cx="169" cy="120" r="8" fill="#0B0D15" stroke="#2FC9E9" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <text x="169" y="160" fill="#E6E9F0" font-size="12.5" font-weight="600">Machine Learning</text>
      <text x="169" y="100" fill="#5E677C" font-size="10.5">02</text>
    </g>
    <g>
      <circle cx="278" cy="120" r="8" fill="#0B0D15" stroke="#3EBFE4" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="278" y="94" fill="#E6E9F0" font-size="12.5" font-weight="600">Deep Learning</text>
      <text x="278" y="152" fill="#5E677C" font-size="10.5">03</text>
    </g>
    <g>
      <circle cx="387" cy="120" r="8" fill="#0B0D15" stroke="#54B0EE" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="387" y="160" fill="#E6E9F0" font-size="12.5" font-weight="600">NLP</text>
      <text x="387" y="100" fill="#5E677C" font-size="10.5">04</text>
    </g>
    <g>
      <circle cx="496" cy="120" r="8" fill="#0B0D15" stroke="#6E93F8" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="496" y="94" fill="#E6E9F0" font-size="12.5" font-weight="600">Generative AI</text>
      <text x="496" y="152" fill="#5E677C" font-size="10.5">05</text>
    </g>
    <g>
      <circle cx="604" cy="120" r="8" fill="#0B0D15" stroke="#7C5CFF" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="604" y="160" fill="#E6E9F0" font-size="12.5" font-weight="600">LLMs</text>
      <text x="604" y="100" fill="#5E677C" font-size="10.5">06</text>
    </g>
    <g>
      <circle cx="713" cy="120" r="8" fill="#0B0D15" stroke="#9557FB" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="713" y="94" fill="#E6E9F0" font-size="12.5" font-weight="600">RAG</text>
      <text x="713" y="152" fill="#5E677C" font-size="10.5">07</text>
    </g>
    <g>
      <circle cx="822" cy="120" r="8" fill="#0B0D15" stroke="#B056F7" stroke-width="2.5">
        <animate attributeName="r" values="8;11.5;8" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="822" y="160" fill="#E6E9F0" font-size="12.5" font-weight="600">Agentic AI</text>
      <text x="822" y="100" fill="#5E677C" font-size="10.5">08</text>
    </g>

    <!-- next direction: not yet learned -->
    <g opacity="0.92">
      <circle cx="931" cy="120" r="8" fill="#0B0D15" stroke="#C86AF9" stroke-width="2" stroke-dasharray="4 3">
        <animateTransform attributeName="transform" type="rotate" from="0 931 120" to="360 931 120" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="931" y="94" fill="#C9D0DE" font-size="12.5" font-weight="600">Cloud Computing</text>
      <text x="931" y="152" fill="#5E677C" font-size="10.5">next</text>
    </g>
    <g opacity="0.92">
      <circle cx="1040" cy="120" r="8" fill="#0B0D15" stroke="#E879F9" stroke-width="2" stroke-dasharray="4 3">
        <animateTransform attributeName="transform" type="rotate" from="360 1040 120" to="0 1040 120" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text x="1040" y="160" fill="#C9D0DE" font-size="12.5" font-weight="600">DevOps</text>
      <text x="1040" y="100" fill="#5E677C" font-size="10.5">next</text>
    </g>

    <text x="550" y="206" fill="#5E677C" font-size="11.5" letter-spacing="3.5">FOUNDATION  →  DEPTH  →  APPLIED AI SYSTEMS  →  NEXT DIRECTION</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2">
    <text x="60" y="34" fill="#4A5266">LEARNING JOURNEY</text>
    <text x="1040" y="34" fill="#4A5266" text-anchor="end">DASHED = NEXT, NOT YET LEARNED</text>
  </g>
</svg>
